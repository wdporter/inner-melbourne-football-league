<!DOCTYPE html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width">
<link rel=icon href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🏉</text></svg>" type="image/svg+xml">
<link rel="stylesheet" href="simple.css">
<title>Inner Melbourne Football League</title>
<style>
* {
	font-variant: no-common-ligatures;
}
.flex {
	display: flex;
}
.justify-between {
	justify-content: space-between;
}
.pl-0 {
	padding-left: 0;
}
.tabular-nums {
	font-variant-numeric: tabular-nums;
}
.text-right {
	text-align: right;	
}
.text-center {
	text-align: center;
}
.font-bold {
	font-weight: 700;
}
.overflow-x-auto {
	overflow-x: auto;
}
.border-b-3 {
	border-bottom-width: 3px;
}
@media (prefers-color-scheme: light) {
	.border-solid {
		border-style: solid;
	}
}

.list-none {
	list-style-type: none;
}
</style>
</head>
<body>

<header>
	<h1>Inner Melbourne Football League 🏉</h1>
</header>

<main id=app>

	<div class="flex justify-between">
		<select v-model=currentYear>
			<option v-for="y in years">{{ y }}</option>
		</select>
		<details><summary>⚙</summary>
			<input type=checkbox v-model=soft id=smfitz @change=invalidate><label for=smfitz>South Melbourne and Fitzroy</label></details>
		</details>
	</div>

	<template v-if="currentYear in seasons">
		<dl v-for="round, index, i of seasons[currentYear].regular">
			<dt>Round {{ i + 1 }}</dt>
			<dd><ul class="list-none pl-0">
				<li v-for="game in round">
					<span :class="{ 'font-bold': game.hscore > game.ascore}">{{  game.hteam }} {{  game.hgoals }}.{{  game.hbehinds }}.{{  game.hscore }}</span> vs. <span :class="{ 'font-bold': game.ascore > game.hscore}">{{  game.ateam }} {{  game.agoals }}.{{  game.abehinds }}.{{  game.ascore }}</span>
				</li>
			</ul></dd>
		</dl>
		<section>
			<h2>&#x1FA9C; Ladder</h2>
			<div class=overflow-x-auto>
				<table>
					<thead>
					<tr>
						<th scope=col></th>
						<!--<th scope=col>Played</th>-->
						<th class=text-right scope=col>W</th>
						<th class=text-right scope=col>L</th>
						<th class=text-right scope=col>D</th>
						<th class=text-right scope=col>F</th>
						<th class=text-right scope=col>A</th>
						<th class=text-right scope=col>%</th>
						<th class=text-right scope=col>Pts</th>
					</tr>
					</thead>
					<tbody>
					<tr v-for="t, i in seasons[currentYear].ladder">
						<th scope=row :class="{'border-b-3': i==(soft ? 4 : 3), 'border-solid': i == (soft ? 4 : 3) }">{{ t.name }}</th>
						<!--<td class=text-right :class="{'border-b-3': i==(soft ? 4 : 3), 'border-solid': i == (soft ? 4 : 3) }">{{ t.wins + t.losses + t.draws }}</td>-->
						<td class="text-right tabular-nums" :class="{'border-b-3': i==(soft ? 4 : 3), 'border-solid': i == (soft ? 4 : 3) }">{{ t.wins }}</td>
						<td class="text-right tabular-nums" :class="{'border-b-3': i==(soft ? 4 : 3), 'border-solid': i == (soft ? 4 : 3) }">{{ t.losses }}</td>
						<td class="text-right tabular-nums" :class="{'border-b-3': i==(soft ? 4 : 3), 'border-solid': i == (soft ? 4 : 3) }">{{ t.draws }}</td>
						<td class="text-right tabular-nums" :class="{'border-b-3': i==(soft ? 4 : 3), 'border-solid': i == (soft ? 4 : 3) }">{{ t.for }}</td>
						<td class="text-right tabular-nums" :class="{'border-b-3': i==(soft ? 4 : 3), 'border-solid': i == (soft ? 4 : 3) }">{{ t.against }}</td>
						<td class="text-right tabular-nums" :class="{'border-b-3': i==(soft ? 4 : 3), 'border-solid': i == (soft ? 4 : 3) }">{{ (t.for / t.against * 100).toFixed(1) }}</td>
						<td class="text-right tabular-nums" :class="{'border-b-3': i==(soft ? 4 : 3), 'border-solid': i == (soft ? 4 : 3) }">{{ t.wins * 4 + t.draws * 2 }}</td>
					</tr> 
					</tbody>
				</table>
			</div>
		</section>
		<dl v-for="round, index, i of seasons[currentYear].finals">
			<dt>Finals Week {{ i + 1 }} <span v-if="i == Object.keys(seasons[currentYear].finals).length-1">🏆</span></dt>
			<dd><ul class="list-none pl-0">
				<li v-for="game in round">
					<span :class="{ 'font-bold': game.hscore > game.ascore}">{{  game.hteam }} {{  game.hgoals }}.{{  game.hbehinds }}.{{  game.hscore }}</span> vs. <span :class="{ 'font-bold': game.ascore > game.hscore}">{{  game.ateam }} {{  game.agoals }}.{{  game.abehinds }}.{{  game.ascore }}</span>
				</li>
			</ul></dd>
		</dl>
		<div v-if="Object.keys(seasons[currentYear].finals).length == 0">
			<h2>No finals played</h2>
		</div>
	</template>
	<section>
		<details><summary>Premiers</summary>
			<p v-if="soft">
				1982–1991 as per VFL/AFL<br />
			</p>
			<p v-else>
				1982–1991 as per VFL/AFL<br />
			</p>
		</details>
	</section>


</main>

<footer>
	made with ❤ love by David Porter
</footer>


<script type=importmap>
{
  "imports": {
    "vue": "https://unpkg.com/vue@3.5.22/dist/vue.esm-browser.js"
  },
  "scopes": {}
}
</script>

<script type=module>
	import { createApp, ref, watchEffect } from "vue"

	
	createApp({
		setup() {
			const currentYear = ref(2025)
			const years = Array.from({ length: currentYear.value - 1982 + 1 }, (x, i) => i + 1982).reverse()
			const seasons = ref({})
			const soft = ref(false)

			const invalidate = () => seasons.value = {}

			watchEffect(async () => {

				if (currentYear.value in seasons.value) {
					return
				}

				const url = `https://api.squiggle.com.au?q=games&year=${currentYear.value}`
				const data = await (await fetch(url)).json()
				console.log(data)
	
				const imposters = ["West Coast", "Greater Western Sydney", "Fremantle", "Adelaide", "Port Adelaide", "Gold Coast"]

				if (!soft.value) {
					imposters.push("Sydney");
					imposters.push("Brisbane Lions")
				}
				const filteredGames = data.games.filter(game => {
					return ! (imposters.includes(game.hteam) || imposters.includes(game.ateam))
				})
				filteredGames.forEach(game => {
					if (game.hteam == "Sydney")
						game.hteam = "South Melbourne"
					if (game.ateam == "Sydney")
						game.ateam = "South Melbourne"
					if (game.hteam == "Brisbane Lions")
						game.hteam = "Fitzroy"
					if (game.ateam == "Brisbane Lions")
						game.ateam = "Fitzroy"
					if (game.hteam == "Western Bulldogs")
						game.hteam = "Footscray"
					if (game.ateam == "Western Bulldogs")
						game.ateam = "Footscray"

					// delete game.ateamid
					// delete game.complete
					// delete game.date
					// delete game.hteamid
					// delete game.id
					// delete game.is_grand_final
					// delete game.localtime
					// delete game.roundname
					// delete game.timestr
					// delete game.tz
					// delete game.unixtime
					// delete game.updated
					// delete game.venue
					// delete game.winner
					// delete game.winnerteamid
				})
				const grouped = Object.groupBy(filteredGames, ({is_final}) => is_final == 0 ? "regular" : "finals")
				grouped.regular = Object.groupBy(grouped.regular, ({round}) => round)
				if (grouped.finals == undefined)
					grouped.finals = {}
				else
					grouped.finals = Object.groupBy(grouped.finals, ({round}) => round)
				//seasons.value[data.games[0].year] = filteredGames
				seasons.value[currentYear.value] = grouped

				// now create a ladder
				seasons.value[currentYear.value].ladder = []
				filteredGames.forEach((game) => {
					if (!seasons.value[currentYear.value].ladder.find(x => x.name==game.hteam)) {
						// teams need to be initialised
						seasons.value[currentYear.value].ladder.push({
							name: game.hteam,
							wins: 0,
							draws: 0,
							losses: 0,
							for: 0,
							against: 0
					})}
					if (!seasons.value[currentYear.value].ladder.find(x => x.name==game.ateam)) {
						// teams need to be initialised
						seasons.value[currentYear.value].ladder.push({
							name: game.ateam,
							wins: 0,
							draws: 0,
							losses: 0,
							for: 0,
							against: 0
					})}

					// find the home team and update it
					let team = seasons.value[currentYear.value].ladder.find(x => x.name == game.hteam)
					if (game.hscore > game.ascore)
						team.wins++
					else if (game.hscore < game.ascore)
						team.losses++	
					else
						team.draws++
					team.for += game.hscore
					team.against += game.ascore
					// find the away team and update it
					team = seasons.value[currentYear.value].ladder.find(x => x.name == game.ateam)
					if (game.ascore > game.hscore)
						team.wins++
					else if (game.ascore < game.hscore)
						team.losses++
					else
						team.draws++
					team.for += game.ascore
					team.against += game.hscore
				})

				seasons.value[currentYear.value].ladder.sort(function(a, b) {
					const apoints = (a.wins * 4) + (a.draws * 2)
					const bpoints = (b.wins * 4) + (b.draws* 2)
					if (apoints < bpoints)
						return 1
					else if (apoints > bpoints)
						return -1
					const apercent = a.for / a.against
					const bpercent = b.for / b.against
					if (apercent < bpercent)
						return 1
					else if (apercent > bpercent)
						return -1
					else return 0
				})
			})

			return {
				currentYear,
				years,
				seasons,
				soft,
				invalidate
			}
	}
}).mount(app)
</script>


</body>
</html>
